name: Release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: CLI release tag to build and publish (provisionless-vX.Y.Z)
        required: true
        type: string

concurrency:
  group: release-artifacts-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: write

jobs:
  deploy-artifacts:
    name: Build deploy artifacts
    if: startsWith(github.event.release.tag_name || inputs.tag, 'provisionless-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use the pinned npm
        run: npm install -g npm@11.9.0

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Build deploy artifacts
        run: node packages/cli/dist/scripts/build-release-artifacts.js --version "${TAG#provisionless-v}" --out "$RUNNER_TEMP/release"

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/release"/* --clobber

  publish-npm:
    name: Publish CLI to npm
    needs: deploy-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Use the pinned npm
        run: npm install -g npm@11.9.0

      - name: Install dependencies
        run: npm ci

      - name: Build the CLI
        run: npm run build --workspace=provisionless

      - name: Verify version, package contents, and release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node packages/cli/dist/scripts/verify-package.js --tag "$TAG"
          version="$(node -p 'require("./packages/cli/package.json").version')"
          if npm view "provisionless@${version}" version >/dev/null 2>&1; then
            echo "::error::provisionless@${version} is already published on npm."
            exit 1
          fi
          for asset in "provisionless-admin-v${version}.zip" "provisionless-api-v${version}.zip" "provisionless-v${version}-SHA256SUMS"; do
            if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$asset"; then
              echo "::error::The $TAG release is missing ${asset}."
              exit 1
            fi
          done

      - name: Publish to npm
        env:
          # The first publish of a new package uses a granular token. Once the package exists,
          # configure a trusted publisher on npmjs.com and remove this secret to publish with OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace=provisionless --provenance --access public
